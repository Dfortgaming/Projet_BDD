<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/login.css">
    <title>BryanTour</title>
</head>
<body>
    <div class="main">
        <div class="form">
            <p class="title">Bryan<span>Tour</span></p>
            <p class="important-text">Page d'accueil</p>
            <div class="form-label">
                <form action="" method="post">
                    <ul>
                        <li>
                            <label for="mail" class="important-text">Adresse mail</label>
                            <input type="text" id="mail" name="mail" required>
                        </li>
                        <li>
                            <label for="password" class="important-text">Mot de passe:</label>
                            <input type="password" id="pssword" name="pssword" required>
                        </li>
                    </ul>
                    <div class="widget-login"> 
                        <label>
                            <input type="checkbox" name="remember-me" value="remember-me">
                            Se souvenir de moi
                        </label>
                        <label for="mail" class="important-text"><a href="google.com">Mot de passe   oublié ?</a>
                        </label>
                    </div>
                    <div class="connection">
                        <button class="button-connection" type="submit">Se connecter</button>
                    </div>
                    
                </form>
            </div>
        </div>
    </div>
    
</body>
</html>
